name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

env:
  DARKTABLE_VERSION: "5.6.1"
  PYTHON_VERSION: "3.12"

jobs:
  pr-title:
    name: PR title follows Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # squash merge: the PR title becomes the commit on main (see CONTRIBUTING.md)
          re='^(feat|fix|docs|test|ci|refactor|perf|chore|build|style|revert)(\([a-z0-9-]+\))?!?: [^ ].*[^.]$'
          if printf '%s' "$TITLE" | grep -Eq "$re"; then echo "ok: $TITLE"
          else echo "::error::PR title is not Conventional Commits: '$TITLE' (expected 'type(scope): summary', no trailing period)"; exit 1; fi

  unit:
    name: unit tests (xmp, hook, dbsync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r tests/requirements.txt
      - name: pytest
        env:
          KPI_DIR: kpi
          KPI_SUITE: unit
        run: python -m pytest tests -m "not darktable" -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kpi-unit
          path: kpi/

  plugin:
    name: plugin manifests and token cost
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: validate manifests
        run: |
          mkdir -p kpi
          { claude plugin validate . && claude plugin validate .claude-plugin/plugin.json; } 2>&1 | tee kpi/validate.txt
      - name: component inventory and always-on token cost
        run: claude --plugin-dir . plugin details darkroom-claude 2>&1 | tee kpi/plugin-details.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kpi-plugin
          path: kpi/

  darktable:
    name: integration on darktable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r tests/requirements.txt
      - name: cache darktable AppImage and sample RAW
        uses: actions/cache@v4
        with:
          path: |
            ~/dt/Darktable.AppImage
            ~/dt/sample.ARW
          key: dt-${{ env.DARKTABLE_VERSION }}-sample-DSC0009
      - name: fetch darktable and sample
        run: |
          mkdir -p ~/dt
          [ -f ~/dt/Darktable.AppImage ] || curl -fsSL -o ~/dt/Darktable.AppImage \
            "https://github.com/darktable-org/darktable/releases/download/release-${DARKTABLE_VERSION}/Darktable-${DARKTABLE_VERSION}-x86_64.AppImage"
          [ -f ~/dt/sample.ARW ] || curl -fsSL -o ~/dt/sample.ARW \
            "https://raw.pixls.us/data/Sony/ILCE-7M3/_DSC0009.ARW"
          # pinned checksums: a changed binary or sample must fail, not run
          echo "867ba61fca41d614e6650fd92d6e7968d8c56a1d1dd2bbc3aa06b52508694ed6  $HOME/dt/Darktable.AppImage
          250784580ea527442c09004417bb0eead484f2bf3ee8f9121a776ac65bb50d0f  $HOME/dt/sample.ARW" | sha256sum -c -
      - name: extract AppImage (no FUSE on runners)
        run: |
          cd ~/dt && chmod +x Darktable.AppImage && ./Darktable.AppImage --appimage-extract > /dev/null
          ls squashfs-root squashfs-root/usr/bin | head -40
      - name: darktable-cli wrapper
        run: |
          cat > ~/dt/darktable-cli <<'EOF'
          #!/bin/bash
          # Run darktable-cli from the extracted AppImage with its bundled libraries.
          R="$HOME/dt/squashfs-root"
          export LD_LIBRARY_PATH="$R/usr/lib:$R/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          export XDG_DATA_DIRS="$R/usr/share:${XDG_DATA_DIRS:-/usr/share}"
          exec "$R/usr/bin/darktable-cli" "$@"
          EOF
          chmod +x ~/dt/darktable-cli
          ~/dt/darktable-cli --version || { ldd ~/dt/squashfs-root/usr/bin/darktable-cli | grep "not found"; exit 1; }
      - name: pytest (darktable)
        env:
          KPI_DIR: kpi
          KPI_SUITE: darktable
          DARKTABLE_CLI: /home/runner/dt/darktable-cli
          DARKROOM_SAMPLE: /home/runner/dt/sample.ARW
        run: python -m pytest tests -m darktable -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kpi-darktable
          path: kpi/

  unit-windows:
    name: unit tests on Windows (xmp, hook, dbsync, dtenv)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r tests/requirements.txt
      - name: pytest
        env:
          KPI_DIR: kpi
          KPI_SUITE: unit-windows
        run: python -m pytest tests -m "not darktable" -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kpi-unit-windows
          path: kpi/

  darktable-windows:
    name: integration on darktable (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r tests/requirements.txt
      - name: cache darktable installer and sample RAW
        uses: actions/cache@v4
        with:
          path: |
            C:\dt\darktable-win64.exe
            C:\dt\sample.ARW
          key: dt-win-${{ env.DARKTABLE_VERSION }}-sample-DSC0009
      - name: fetch installer and sample
        run: |
          mkdir -p /c/dt
          [ -f /c/dt/darktable-win64.exe ] || curl -fsSL -o /c/dt/darktable-win64.exe \
            "https://github.com/darktable-org/darktable/releases/download/release-${DARKTABLE_VERSION}/darktable-${DARKTABLE_VERSION}-win64.exe"
          [ -f /c/dt/sample.ARW ] || curl -fsSL -o /c/dt/sample.ARW \
            "https://raw.pixls.us/data/Sony/ILCE-7M3/_DSC0009.ARW"
          # pinned checksums (installer: the digest GitHub reports for the release asset)
          echo "bb15a8e4d24c21097cfdef0a560920f7fa0c05dec93482448dd538f2be02d6c4  /c/dt/darktable-win64.exe
          250784580ea527442c09004417bb0eead484f2bf3ee8f9121a776ac65bb50d0f  /c/dt/sample.ARW" | sha256sum -c -
      - name: silent install (Inno Setup flags, the process is darktable-win64.tmp)
        shell: pwsh
        timeout-minutes: 10
        run: |
          # Inno Setup, not NSIS: /S and /D= are ignored and the wizard waits for a click forever.
          # No -Wait: it also waits for any child the installer leaves running. Poll for the binary instead.
          $p = Start-Process -FilePath 'C:\dt\darktable-win64.exe' -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/DIR=C:\darktable' -PassThru
          $cli = 'C:\darktable\bin\darktable-cli.exe'
          $deadline = (Get-Date).AddMinutes(6)
          while (-not (Test-Path $cli) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 5 }
          Start-Sleep -Seconds 10  # let the installer finish writing
          if (-not (Test-Path $cli)) { throw "darktable-cli.exe not installed after 6 min (installer exited: $($p.HasExited))" }
          Get-ChildItem $cli
          & C:\darktable\bin\darktable-cli.exe --version
      - name: diagnostics (throwaway, #31)
        timeout-minutes: 8
        env:
          DARKROOM_SAMPLE: C:\dt\sample.ARW
          DARKTABLE_CLI: C:\darktable\bin\darktable-cli.exe
        run: python ci/diag_win.py
      - name: pytest (darktable)
        timeout-minutes: 25
        env:
          KPI_DIR: kpi
          KPI_SUITE: darktable-windows
          DARKROOM_RENDER_TIMEOUT: "120"
          DARKTABLE_CLI: C:\darktable\bin\darktable-cli.exe
          DARKROOM_SAMPLE: C:\dt\sample.ARW
        run: python -m pytest tests -m darktable -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kpi-darktable-windows
          path: kpi/

  kpi:
    name: KPIs
    needs: [unit, unit-windows, plugin, darktable, darktable-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kpi-*
          path: artifacts
          merge-multiple: true
      - name: compute and enforce KPIs
        run: python3 ci/kpi.py artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kpis
          path: artifacts/kpis.json
